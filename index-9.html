<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Heart Marker - Rose Bloom AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Special+Elite&family=Nanum+Gothic+Coding:wght@400;700&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  #status {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    color: #fff; font-family: sans-serif; font-size: 13px;
    background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 999px;
    z-index: 1000; pointer-events: none;
  }

  :root { --paper:#f4ead4; --paper2:#efe2c4; --ink:#2a2420; --red:#a8322a; --green:#2f6b43; --kraft:#d8bd91; --kraft-d:#b99a68; }
  #guideHelp {
    position: fixed; top: 10px; right: 12px; z-index: 1001; width: 36px; height: 36px; border-radius: 50%;
    border: 2px solid var(--ink); background: var(--paper); color: var(--ink);
    font: 400 18px 'Special Elite', monospace; display: none; box-shadow: 0 2px 0 rgba(0,0,0,.35);
  }
  #guide {
    position: fixed; inset: 0; z-index: 2000; background: #1b1916; color: var(--ink);
    font-family: 'Nanum Gothic Coding','Noto Sans KR',monospace; word-break: keep-all;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  #guide .sheet {
    position: relative; margin: 14px auto 18px; width: calc(100% - 24px); max-width: 430px; box-sizing: border-box;
    padding: 22px 18px 24px; border-radius: 6px 10px 8px 12px;
    background: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .35 0 0 0 0 .27 0 0 0 0 .15 0 0 0 .22 0'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)'/%3E%3C/svg%3E"), linear-gradient(170deg, var(--paper), var(--paper2));
    box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.55), inset 0 0 40px rgba(120,80,30,.18);
  }
  #guide .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  #guide .sys { font: 400 26px 'Special Elite', monospace; color: var(--red); letter-spacing: .04em; }
  #guide .stamp {
    transform: rotate(3deg); border: 2px solid var(--red); color: var(--red); padding: 3px 9px 4px;
    font: 400 11px 'Special Elite', monospace; line-height: 1.25; text-align: center; opacity: .88;
    background: rgba(168,50,42,.06); border-radius: 3px;
  }
  #guide .stamp small { display:block; font-size: 8px; letter-spacing: .02em; }
  #guide .tape {
    position: relative; display: inline-block; margin: 2px 0 12px -6px; padding: 8px 18px 8px 16px;
    background: linear-gradient(180deg,#f5e3a1,#ecd484); color: var(--ink); transform: rotate(-1.2deg);
    font: 700 17px 'Noto Sans KR', sans-serif; line-height: 1.3; white-space: nowrap;
    box-shadow: 0 2px 4px rgba(0,0,0,.25);
    clip-path: polygon(0 6%,3% 0,97% 4%,100% 0,98% 50%,100% 100%,3% 96%,0 100%,2% 50%);
  }
  #guide .lead { margin: 0 0 16px; font-size: 14px; line-height: 1.65; color: #3a322c; }
  #guide .lead b { background: linear-gradient(transparent 58%, rgba(235,200,90,.7) 58%); font-weight: 700; color: var(--ink); }
  #guide .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 6px 0 20px; }
  #guide .card { position: relative; padding: 7px 7px 8px; background: #fbf6e8; border-radius: 3px;
    box-shadow: 0 2px 6px rgba(60,40,10,.35); text-align: center; }
  #guide .card:nth-child(1) { transform: rotate(-1.6deg); }
  #guide .card:nth-child(2) { transform: rotate(.8deg) translateY(-2px); }
  #guide .card:nth-child(3) { transform: rotate(-.6deg); }
  #guide .card svg { width: 100%; height: auto; display: block; background: #f0e6cc; border: 1px solid rgba(60,40,20,.3); }
  #guide .clip { position:absolute; top:-11px; left:9px; width:12px; height:26px; border:2px solid #8a8d92; border-radius:7px;
    transform: rotate(6deg); background: transparent; }
  #guide .clip::after { content:''; position:absolute; left:1px; top:7px; width:6px; height:14px; border:2px solid #8a8d92; border-radius:5px; }
  #guide .verdict { margin-top: 7px; font: 400 15px 'Special Elite', monospace; letter-spacing: .08em; }
  #guide .no .verdict { color: var(--red); }
  #guide .ok .verdict { color: var(--green); }
  #guide .cap { margin-top: 2px; font-size: 11px; line-height: 1.4; color: #5a4e44; }
  #guide h2 { margin: 0 0 8px; font: 400 15px 'Special Elite', monospace; letter-spacing: .12em; color: var(--ink);
    border-bottom: 1.5px solid rgba(60,40,20,.45); padding-bottom: 5px; }
  #guide ol { margin: 0 0 16px; padding: 0; list-style: none; counter-reset: s; }
  #guide li { counter-increment: s; position: relative; padding: 11px 12px 11px 50px; margin-bottom: 9px; font-size: 14px; line-height: 1.55;
    background: var(--kraft); border-radius: 3px; box-shadow: 0 2px 3px rgba(60,40,10,.3); color: #2c241d; }
  #guide li:nth-child(odd) { transform: rotate(-.5deg); }
  #guide li:nth-child(even) { transform: rotate(.5deg); }
  #guide li::before { content: counter(s, decimal-leading-zero); position: absolute; left: 11px; top: 50%; transform: translateY(-50%) rotate(-4deg);
    font: 400 20px 'Special Elite', monospace; color: var(--red); }
  #guide li b { font-weight: 700; color: #1d1712; }
  #guide .note { margin: 0 0 20px; padding: 9px 11px; font-size: 12px; line-height: 1.6; color: #5a4e44;
    border: 1.5px dashed rgba(60,40,20,.5); border-radius: 4px; background: rgba(255,255,255,.25); }
  #guideGo { position: relative; width: 100%; padding: 15px 0; border: 0; border-radius: 16px; background: #2b2622; color: #f4ead4;
    font: 700 16px 'Noto Sans KR', sans-serif; letter-spacing: .08em; box-shadow: 0 4px 0 #120f0d, 0 8px 14px rgba(0,0,0,.35); }
  #guideClose { display: none; position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%;
    border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font: 400 20px/1 'Special Elite', monospace;
    box-shadow: 0 2px 0 rgba(0,0,0,.35); padding: 0; }
  #guide.reopen #guideClose { display: block; }
  #guide.reopen #guideGo { display: none; }
  #guideGo:active { transform: translateY(2px); box-shadow: 0 2px 0 #120f0d; }
</style>
</head>

<path d="M30 38 H70 M26 52 H74 M32 66 H68 M50 24 V80" stroke="#2a2420" stroke-opacity=".5" stroke-width="3.81"/></g></g><path d="M12 28 V12 H28" stroke="#2a2420" stroke-opacity=".55" stroke-width="5.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 28 V12 H28" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M72 12 H88 V28" stroke="#2a2420" stroke-opacity=".55" stroke-width="5.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M72 12 H88 V28" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M88 72 V88 H72" stroke="#2a2420" stroke-opacity=".55" stroke-width="5.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M88 72 V88 H72" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 88 H12 V72" stroke="#2a2420" stroke-opacity=".55" stroke-width="5.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 88 H12 V72" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>

    <h2>PROCEDURE</h2>
    <ol>
      <li><b>스캔 대상</b> 전체가 한눈에 보이는 거리까지 물러난다.</li>
      <li>네모 틀 안에 <b>스캔 대상이 가득 차게</b> 맞춘다.</li>
      <li>카메라를 <b>정면에서 고정</b>하고 잠시 기다린다.</li>

    <p class="note">※ 인식이 끊기면 카메라를 잠시 내려 화면을 몇초동안 재정비한 후에 다시 인식해 볼것.</p>

</div>
<div id="container" style="width: 100vw; height: 100vh;"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js",
    "fflate": "https://esm.sh/fflate@0.8.2"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const statusEl = document.getElementById('status');

try {
  const mindarThree = new MindARThree({
    container: document.querySelector('#container'),
    imageTargetSrc: './targets.mind',
    // 깜빡임 방지: 몇 프레임 놓쳐도 바로 '사라짐'으로 처리하지 않고, 떨림은 더 부드럽게
    missTolerance: 5,
    warmupTolerance: 5,
    filterMinCF: 0.0005,
    filterBeta: 300,
  });
  const LOST_GRACE_MS = 1200;  // 인식이 끊겨도 이 시간 안에 다시 잡히면 그대로 유지

  const { renderer, scene, camera } = mindarThree;

  scene.add(new THREE.AmbientLight(0xffffff, 2.6));
  const dirLight = new THREE.DirectionalLight(0xffffff, 2.8);
  dirLight.position.set(1, 3, 2);
  scene.add(dirLight);
  const fillLight = new THREE.DirectionalLight(0xffe8e0, 1.6);
  fillLight.position.set(-2, 1, -1);
  scene.add(fillLight);

  // 타겟 0~7: 하트 조형물(야간 1장 + 주간 6장 + 정면 1장) → 장미
  // 타겟 8: 가로등에 붙은 BB 로고 스티커 → 아래에 BLANK 글자
  const anchors = [0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => mindarThree.addAnchor(i));
  const blankAnchor = anchors[8];

  const COLOR_VARIANTS = [
    { name: 'red',    color: 0xffffff },
    { name: 'pink',   color: 0xffb7cf },
    { name: 'yellow', color: 0xffdf6b },
    { name: 'white',  color: 0xffffff },
  ];

  // ------------------------------------------------------------
  // 하트 바깥쪽 배치 좌표 (마커 평면 기준, 단위: 마커 가로폭 = 1)
  // 규칙적으로 안 보이도록 각 위치에 약간의 랜덤 흔들림(jitter)을 더함
  // ------------------------------------------------------------
  // y값을 전체적으로 0.1만큼 낮춰서 조형물에 더 붙게 조정 (기존 대비)
  const BASE_LAYOUT = [
    { x: -0.24, y:  0.37, z: 0.05, scaleMul: 0.9,  delay: 0.0  },
    { x:  0.24, y:  0.37, z: 0.05, scaleMul: 0.9,  delay: 0.25 },
    { x: -0.51, y:  0.22, z: 0.05, scaleMul: 1.0,  delay: 0.5  },
    { x:  0.51, y:  0.22, z: 0.05, scaleMul: 1.0,  delay: 0.75 },
    { x: -0.60, y: -0.02, z: 0.05, scaleMul: 0.85, delay: 1.0  },
    { x:  0.60, y: -0.02, z: 0.05, scaleMul: 0.85, delay: 1.25 },
    { x: -0.51, y: -0.19, z: 0.05, scaleMul: 1.05, delay: 1.5  },
    { x:  0.51, y: -0.19, z: 0.05, scaleMul: 1.05, delay: 1.75 },
    // 조형물 안쪽(거울 패널 앞) 장미 1송이 - 가까이서 찍어 바깥 장미가 안 잡힐 때용
    { x:  0.00, y:  0.06, z: 0.14, scaleMul: 1.15, delay: 0.0  },
  ];
  function jitter(n) { return (Math.random() - 0.5) * n; }
  const LAYOUT = BASE_LAYOUT.map(pos => ({
    x: pos.x + jitter(0.08),
    y: pos.y + jitter(0.08),
    z: pos.z + jitter(0.03),
    // 크기 편차를 30%(0.85~1.15)에서 12%(0.94~1.06)로 줄여서 들쭉날쭉함 완화
    scaleMul: pos.scaleMul * (0.94 + Math.random() * 0.12),
    delay: pos.delay + jitter(0.2),
  }));

  const BLOOM_DURATION = 0.9;

  function easeOutBack(t) {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  const anchorStates = anchors.slice(0, 8).map(a => {
    const smoothGroup = new THREE.Group();
    smoothGroup.visible = false;
    scene.add(smoothGroup);
    return { anchor: a, smoothGroup, roses: [], markerVisible: false, foundTime: null };
  });

  let modelReady = false;
  let cameraReady = false;

  function refreshIdleStatus() {
    // 모델/카메라 둘 다 준비되기 전까지는 "대기중" 문구를 보여주지 않음
    // (장미가 아직 안 실렸는데 '대기중'이라고 떠서 헷갈리는 문제 방지)
    if (!cameraReady) return;
    if (!modelReady) { statusEl.textContent = '장미 모델 로딩 중...'; return; }
    statusEl.textContent = '현장 분석 중...';
  }

  // ------------------------------------------------------------
  // 타겟 7: BB 로고 스티커를 스캔하면 로고 아래에 "BLANK" 글자가 나타남
  // 위치/크기 단위: 마커 가로폭 = 1, 세로는 이미지 비율(792/906)만큼
  // ------------------------------------------------------------
  const BLANK_TARGET_ASPECT = 792 / 906;   // 컴파일에 쓴 로고 이미지의 세로/가로 비율
  const BLANK_TEXT_Y = -(BLANK_TARGET_ASPECT / 2) - 0.10;  // 스티커 아래쪽 가장자리 바로 밑
  const BLANK_TEXT_WIDTH = 0.64;           // 글자 가로폭 (마커 가로폭 대비)
  const BLANK_FADE_SEC = 0.7;

  const blankState = { markerVisible: false, justFound: false, foundTime: 0, smoothGroup: new THREE.Group(), material: null };
  blankState.smoothGroup.visible = false;
  scene.add(blankState.smoothGroup);

  function buildBlankText() {
    const cw = 1024, ch = 256;
    const cvs = document.createElement('canvas');
    cvs.width = cw; cvs.height = ch;
    const ctx = cvs.getContext('2d');
    ctx.clearRect(0, 0, cw, ch);
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 150px Montserrat, "Arial Black", "Helvetica Neue", Arial, sans-serif';
    if ('letterSpacing' in ctx) ctx.letterSpacing = '36px';
    ctx.fillText('BLANK', cw / 2 + 18, ch / 2 + 6);
    const tex = new THREE.CanvasTexture(cvs);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(BLANK_TEXT_WIDTH, BLANK_TEXT_WIDTH * ch / cw), mat);
    mesh.position.set(0, BLANK_TEXT_Y, 0.01);
    blankState.smoothGroup.add(mesh);
    blankState.material = mat;
  }
  // 폰트가 로드된 뒤에 글자 텍스처를 만든다(안 되면 기본 굵은 글꼴로 대체)
  (document.fonts && document.fonts.load ? document.fonts.load('700 150px Montserrat') : Promise.resolve())
    .catch(() => {}).then(buildBlankText);

  blankAnchor.onTargetFound = () => {
    if (blankState.lostTimer) {          // 잠깐 끊겼다 다시 잡힘 → 리셋 없이 그대로 유지
      clearTimeout(blankState.lostTimer);
      blankState.lostTimer = null;
      statusEl.textContent = '대상 확인됨 - 소속 식별 중...';
      return;
    }
    blankState.markerVisible = true;
    blankState.justFound = true;
    blankState.smoothGroup.visible = true;
    blankState.foundTime = performance.now();
    statusEl.textContent = '대상 확인됨 - 소속 식별 중...';
  };
  blankAnchor.onTargetLost = () => {
    if (blankState.lostTimer) clearTimeout(blankState.lostTimer);
    refreshIdleStatus();   // 문구는 바로 '현장 분석 중...'으로, 글자는 잠깐 유지
    blankState.lostTimer = setTimeout(() => {
      blankState.lostTimer = null;
      blankState.markerVisible = false;
      blankState.smoothGroup.visible = false;
      if (blankState.material) blankState.material.opacity = 0;
      refreshIdleStatus();
    }, LOST_GRACE_MS);
  };

  // ------------------------------------------------------------
  // 장미 4종류를 모두 불러와서 장미 한 송이씩 랜덤으로 섞어 사용.
  // rose.glb는 재질이 petal/leaf로 분리되어 있어 COLOR_VARIANTS로 색 틴트가 먹히고,
  // 나머지(사진스캔 모델)는 이미 고유 색이 입혀져 있어 틴트 로직이 자동으로 無처리됨.
  // ------------------------------------------------------------
  // rotationFix: 이 모델의 "원래 자세"가 rose.glb 기준(줄기 아래, 꽃 위)과
  // 다를 경우 여기서 라디안 단위로 보정. 전부 스캔 모델이라 축이 제각각일 수 있어
  // 일단 0으로 두고, 실제로 확인한 뒤 수치를 채워 넣을 예정 (예: 90도 돌아가 있으면
  // Math.PI/2 를 x/y/z 중 해당 축에 넣으면 됨).
  // sizeMul: 전체 키(줄기+꽃) 기준으로만 맞추면 꽃송이 자체 비율이 다른 스캔
  // 모델들이 상대적으로 너무 커 보이는 문제가 있어서, 빨간 장미(rose.glb)의
  // "꽃송이 크기"를 기준으로 추가 보정한 배율. (줄기가 짧고 꽃이 큰 모델일수록
  // 작게 조정됨)
  const MODEL_SOURCES = [
    { src: './rose.glb',  rotationFix: { x: 0, y: 0, z: 0 },                              sizeMul: 1.0  },
    { src: './rose2.glb', rotationFix: { x: 0.1899, y: -0.0922, z: -0.9017 },              sizeMul: 0.68 },
    { src: './rose3.glb', rotationFix: { x: -0.4949, y: 0.5999, z: -1.7718 },              sizeMul: 0.72 },
    { src: './rose4.glb', rotationFix: { x: -0.1682, y: 0.0129, z: -0.153 },               sizeMul: 0.95 },
  ];
  const loader = new GLTFLoader();
  const loadedModels = []; // { scene, autoScale, rotationFix }

  Promise.all(MODEL_SOURCES.map(({ src, rotationFix, sizeMul }) => new Promise((resolve) => {
    loader.load(src, (gltf) => {
      const sceneRoot = gltf.scene;
      const box = new THREE.Box3().setFromObject(sceneRoot);
      const size = new THREE.Vector3();
      box.getSize(size);
      const autoScale = (0.32 / (size.y || 1)) * sizeMul;
      resolve({ scene: sceneRoot, autoScale, rotationFix });
    }, undefined, (err) => {
      console.error('GLB load error (' + src + '):', err);
      resolve(null); // 하나 실패해도 나머지로 계속 진행
    });
  }))).then(results => {
    results.forEach(r => { if (r) loadedModels.push(r); });
    if (loadedModels.length === 0) {
      statusEl.textContent = '모델 로드 실패';
      return;
    }
    startLoadingRoses();
    modelReady = true;
    refreshIdleStatus();
  });

  function startLoadingRoses() {
    anchorStates.forEach(state => {
      LAYOUT.forEach(pos => {
        const group = new THREE.Group();

        const picked = loadedModels[Math.floor(Math.random() * loadedModels.length)];
        const instance = picked.scene.clone(true);

        // 모델별 고정 자세 보정(한 번만 적용, 이후 애니메이션은 바깥 group에서만 돌아감)
        instance.rotation.set(picked.rotationFix.x, picked.rotationFix.y, picked.rotationFix.z);

        const variant = COLOR_VARIANTS[Math.floor(Math.random() * COLOR_VARIANTS.length)];

        instance.traverse(child => {
          if (child.isMesh && child.material) {
            const nameLower = (child.name + ' ' + (child.material.name || '')).toLowerCase();
            if (nameLower.includes('petal')) {
              child.material = child.material.clone();
              child.material.color.setHex(variant.color);
            }
          }
        });

        group.add(instance);
        group.position.set(pos.x, pos.y, pos.z);
        group.scale.setScalar(0.0001);
        state.smoothGroup.add(group);

        state.roses.push({
          group,
          targetScale: picked.autoScale * pos.scaleMul,
          delay: pos.delay,
          spawned: false,
          startTime: null,
          tiltPhase: Math.random() * Math.PI * 2,
          tiltSpeed: 0.00035 + Math.random() * 0.00025,
          spinSpeed: 0.0025 + Math.random() * 0.0025,
          bobPhase: Math.random() * Math.PI * 2,
          bobSpeed: 0.0008 + Math.random() * 0.0006,
        });
      });
    });
  }

  anchorStates.forEach(state => {
    state.anchor.onTargetFound = () => {
      if (state.lostTimer) {             // 잠깐 끊겼다 다시 잡힘 → 장미 리셋 없이 유지
        clearTimeout(state.lostTimer);
        state.lostTimer = null;
        statusEl.textContent = '대상 확인됨 - 증거 분석 중...';
        return;
      }
      state.markerVisible = true;
      state.justFound = true;
      state.smoothGroup.visible = true;
      state.foundTime = performance.now();
      statusEl.textContent = modelReady ? '대상 확인됨 - 증거 분석 중...' : '대상 확인됨 - 데이터 로딩 중...';
      state.roses.forEach(r => { r.spawned = false; r.startTime = null; });
    };
    state.anchor.onTargetLost = () => {
      if (state.lostTimer) clearTimeout(state.lostTimer);
      refreshIdleStatus();   // 문구는 바로 '현장 분석 중...'으로, 장미는 잠깐 유지
      state.lostTimer = setTimeout(() => {
        state.lostTimer = null;
        state.markerVisible = false;
        refreshIdleStatus();
        state.roses.forEach(r => { r.group.scale.setScalar(0.0001); r.spawned = false; });
      }, LOST_GRACE_MS);
    };
  });

  const start = async () => {
    statusEl.textContent = '카메라 시작 중...';
    try {
      await mindarThree.start();
    } catch (startErr) {
      statusEl.textContent = '카메라 시작 실패: ' + startErr.message;
      console.error(startErr);
      return;
    }

    cameraReady = true;
    refreshIdleStatus();

    renderer.setAnimationLoop(() => {
      let needsUpdate = false;
      if (!camera.fov || camera.fov < 1) { camera.fov = 60; needsUpdate = true; }
      const correctAspect = window.innerWidth / window.innerHeight;
      if (!camera.aspect || Math.abs(camera.aspect - correctAspect) > 0.01) {
        camera.aspect = correctAspect;
        needsUpdate = true;
      }
      if (needsUpdate) camera.updateProjectionMatrix();

      const now = performance.now();
      scene.updateMatrixWorld(true);

      if (modelReady) {
        anchorStates.forEach(state => {
          if (!state.markerVisible) return;

          const targetPos = new THREE.Vector3();
          const targetQuat = new THREE.Quaternion();
          const targetScale = new THREE.Vector3();
          state.anchor.group.matrixWorld.decompose(targetPos, targetQuat, targetScale);

          if (state.justFound) {
            state.smoothGroup.position.copy(targetPos);
            state.smoothGroup.quaternion.copy(targetQuat);
            state.smoothGroup.scale.copy(targetScale);
            state.justFound = false;
          } else {
            const SMOOTH = 0.06;
            state.smoothGroup.position.lerp(targetPos, SMOOTH);
            state.smoothGroup.quaternion.slerp(targetQuat, SMOOTH);
            state.smoothGroup.scale.lerp(targetScale, SMOOTH);
          }

          state.roses.forEach(r => {
            if (!r.spawned) {
              const elapsedSinceFound = (now - state.foundTime) / 1000;
              if (elapsedSinceFound >= r.delay) {
                r.spawned = true;
                r.startTime = now;
              }
            }
            if (r.spawned) {
              const t = Math.min(1, (now - r.startTime) / 1000 / BLOOM_DURATION);
              const eased = easeOutBack(t);

              const bob = t >= 1 ? Math.sin(now * r.bobSpeed + r.bobPhase) * 0.04 : 0;
              r.group.scale.setScalar(Math.max(0.0001, r.targetScale * eased * (1 + bob)));

              r.group.rotation.y += r.spinSpeed;

              const TOP_TILT = Math.PI / 2.3;
              const ANGLE_TILT = -Math.PI / 7;
              const blend = (Math.sin(now * r.tiltSpeed + r.tiltPhase) + 1) / 2;
              r.group.rotation.x = TOP_TILT + (ANGLE_TILT - TOP_TILT) * blend;
            }
          });
        });
      }

      if (blankState.markerVisible && blankState.material) {
        const bp = new THREE.Vector3(), bq = new THREE.Quaternion(), bs = new THREE.Vector3();
        blankAnchor.group.matrixWorld.decompose(bp, bq, bs);
        if (blankState.justFound) {
          blankState.smoothGroup.position.copy(bp);
          blankState.smoothGroup.quaternion.copy(bq);
          blankState.smoothGroup.scale.copy(bs);
          blankState.justFound = false;
        } else {
          blankState.smoothGroup.position.lerp(bp, 0.06);
          blankState.smoothGroup.quaternion.slerp(bq, 0.06);
          blankState.smoothGroup.scale.lerp(bs, 0.06);
        }
        const bt = Math.min(1, (now - blankState.foundTime) / 1000 / BLANK_FADE_SEC);
        // 살짝 깜빡이며 나타났다가 안정되는 연출
        const flick = bt < 1 ? (Math.random() < 0.18 ? 0.35 : 1) : 1;
        blankState.material.opacity = bt * flick;
      }

      renderer.render(scene, camera);
    });
  };

  // 안내 화면에서 '스캔 시작'을 눌러야 카메라가 켜짐
  const guideEl = document.getElementById('guide');
  const helpBtn = document.getElementById('guideHelp');
  let started = false;
  document.getElementById('guideGo').addEventListener('click', () => {
    guideEl.style.display = 'none';
    helpBtn.style.display = 'block';
    if (!started) { started = true; start(); }
  });
  // ? 버튼: 안내를 다시 보되, 스캔 시작 버튼 대신 오른쪽 위 X로 닫는다
  helpBtn.addEventListener('click', () => {
    guideEl.classList.add('reopen');
    guideEl.style.display = 'flex';
    guideEl.scrollTop = 0;
  });
  document.getElementById('guideClose').addEventListener('click', () => { guideEl.style.display = 'none'; });

} catch (err) {
  statusEl.textContent = '오류: ' + err.message;
  console.error(err);
}
</script>

</body>
</html>
